# بناء تطبيق ريم للآيفون على أجهزة ماك في Codemagic ورفعه إلى TestFlight
workflows:
  reem-ios:
    name: ريم — آيفون
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: ios-app
    integrations:
      app_store_connect: manakh_asc        # نفس مفتاح App Store Connect حق مناخ (يصلح لكل التطبيقات)
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.salemaljabri.reem
      node: 20
      xcode: latest
    scripts:
      - name: تثبيت الحزم وتجهيز الملفات
        script: |
          npm install
          npm run build
      - name: إنشاء مشروع iOS
        script: |
          [ -d ios ] || npx cap add ios
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "[0-9,]*";/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj
          [ -f ios/App/Podfile ] && sed -i '' "s/platform :ios, .*/platform :ios, '15.0'/" ios/App/Podfile
          npm run assets
          npx cap sync ios
      - name: إعدادات التطبيق (الاسم، الميكروفون، الكلام، رابط سيري)
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ريم" $PLIST
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string ريم تسمع كلامك عشان تسجل مواعيدك وترد عليك" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :NSContactsUsageDescription string ريم تدور على الشخص في جهات اتصالك عشان تتصل فيه أو تراسله لما تطلب منها" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string ريم تحوّل كلامك إلى نص عشان تفهم طلبك" $PLIST || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion ar" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:0 string ar" $PLIST || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" $PLIST
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.salemaljabri.reem" $PLIST
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string reem" $PLIST
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $PLIST
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $PLIST || true
      - name: التوقيع
        script: xcode-project use-profiles
      - name: رقم البناء
        script: |
          cd ios/App
          agvtool new-version -all $((BUILD_NUMBER + 1))
      - name: بناء ملف IPA
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - ios-app/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false     # تظهر في TestFlight للمختبرين الداخليين (أنت) بدون مراجعة
